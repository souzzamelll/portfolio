<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="cidadeSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#090D16"/>
    </linearGradient>
    <linearGradient id="hudPillBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="neonRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E"/>
      <stop offset="100%" stop-color="#BE123C"/>
    </linearGradient>
    <linearGradient id="goldMoney" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="cityGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Browser Frame Wrapper -->
  <rect width="800" height="500" rx="16" fill="#0B0F19"/>
  
  <!-- Browser Chrome Header Bar -->
  <rect width="800" height="42" rx="16" fill="#182030"/>
  <rect y="30" width="800" height="12" fill="#182030"/>
  <!-- Window Dots -->
  <circle cx="28" cy="21" r="5.5" fill="#EF4444"/>
  <circle cx="46" cy="21" r="5.5" fill="#F59E0B"/>
  <circle cx="64" cy="21" r="5.5" fill="#10B981"/>
  <!-- URL Pill -->
  <rect x="220" y="9" width="360" height="24" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1"/>
  <text x="400" y="25" font-family="'Poppins', sans-serif" font-size="11" fill="#94A3B8" text-anchor="middle">jogocidade.vercel.app</text>

  <!-- Game Canvas Stage Background -->
  <g transform="translate(0, 42)">
    <rect width="800" height="458" fill="url(#cidadeSky)"/>

    <!-- Subtle Isometric Grid in canvas -->
    <g stroke="#334155" stroke-width="0.8" opacity="0.35">
      <path d="M400 120 L760 300 L400 480 L40 300 Z"/>
      <path d="M400 160 L680 300 L400 440 L120 300 Z"/>
      <path d="M400 200 L600 300 L400 400 L200 300 Z"/>
      <!-- Grid cross lines -->
      <line x1="160" y1="240" x2="640" y2="240"/>
      <line x1="220" y1="360" x2="580" y2="360"/>
      <line x1="400" y1="120" x2="400" y2="480"/>
      <line x1="40" y1="300" x2="760" y2="300"/>
    </g>

    <!-- Isometric City Roads -->
    <g fill="#1E293B" stroke="#475569" stroke-width="1.5">
      <!-- Main Diagonal Road NW to SE -->
      <polygon points="400,150 460,180 200,310 140,280"/>
      <!-- Main Diagonal Road NE to SW -->
      <polygon points="660,280 600,310 340,180 400,150"/>
      <!-- Intersection cross -->
      <polygon points="400,280 460,310 340,370 280,340"/>
      <polygon points="520,340 460,370 340,310 400,280"/>
    </g>

    <!-- Road dashed yellow center lines -->
    <g stroke="#FBBF24" stroke-width="1.2" stroke-dasharray="6 6" opacity="0.75">
      <line x1="400" y1="150" x2="170" y2="295"/>
      <line x1="400" y1="150" x2="630" y2="295"/>
      <line x1="400" y1="280" x2="490" y2="355"/>
      <line x1="400" y1="280" x2="310" y2="355"/>
    </g>

    <!-- Isometric Buildings & Facilities -->
    <!-- High-rise Glass Tower (Center-Right) -->
    <g transform="translate(430, 170)">
      <!-- Left Face -->
      <polygon points="0,70 50,95 50,-10 0,-35" fill="#1E3A8A"/>
      <!-- Right Face -->
      <polygon points="50,95 100,70 100,-35 50,-10" fill="#2563EB"/>
      <!-- Top Face -->
      <polygon points="0,-35 50,-10 100,-35 50,-60" fill="#60A5FA"/>
      <!-- Glass windows pattern -->
      <g stroke="#93C5FD" stroke-width="0.8" opacity="0.7">
        <line x1="12" y1="-20" x2="12" y2="70"/>
        <line x1="26" y1="-12" x2="26" y2="78"/>
        <line x1="38" y1="-5" x2="38" y2="85"/>
        <line x1="62" y1="-5" x2="62" y2="85"/>
        <line x1="74" y1="-12" x2="74" y2="78"/>
        <line x1="88" y1="-20" x2="88" y2="70"/>
      </g>
      <!-- Roof Antenna -->
      <line x1="50" y1="-60" x2="50" y2="-90" stroke="#F43F5E" stroke-width="2"/>
      <circle cx="50" cy="-90" r="3" fill="#EF4444" filter="url(#cityGlow)"/>
    </g>

    <!-- Commercial Building (Center-Left) -->
    <g transform="translate(240, 190)">
      <!-- Left Face -->
      <polygon points="0,50 45,72 45,10 0,-12" fill="#0D9488"/>
      <!-- Right Face -->
      <polygon points="45,72 90,50 90,-12 45,10" fill="#14B8A6"/>
      <!-- Top Face -->
      <polygon points="0,-12 45,10 90,-12 45,-34" fill="#5EEAD4"/>
      <!-- Windows -->
      <rect x="52" y="22" width="10" height="14" fill="#CCFBF1" rx="1"/>
      <rect x="68" y="14" width="10" height="14" fill="#CCFBF1" rx="1"/>
      <rect x="52" y="44" width="10" height="14" fill="#CCFBF1" rx="1"/>
      <rect x="68" y="36" width="10" height="14" fill="#CCFBF1" rx="1"/>
    </g>

    <!-- Residential / Urban Houses (Front Left) -->
    <g transform="translate(180, 275)">
      <polygon points="0,35 30,50 30,15 0,0" fill="#EA580C"/>
      <polygon points="30,50 60,35 60,0 30,15" fill="#F97316"/>
      <polygon points="0,0 30,15 60,0 30,-15" fill="#FDBA74"/>
      <!-- Roof chimney -->
      <rect x="42" y="-12" width="6" height="10" fill="#7C2D12"/>
    </g>

    <g transform="translate(235, 305)">
      <polygon points="0,30 25,42 25,12 0,0" fill="#7C3AED"/>
      <polygon points="25,42 50,30 50,0 25,12" fill="#8B5CF6"/>
      <polygon points="0,0 25,12 50,0 25,-12" fill="#C4B5FD"/>
    </g>

    <!-- Green Park & Lake (Center Bottom) -->
    <g transform="translate(330, 280)">
      <!-- Park Grass Plot -->
      <polygon points="0,35 70,70 140,35 70,0" fill="#15803D" stroke="#166534" stroke-width="1"/>
      <!-- Mini Lake -->
      <ellipse cx="70" cy="35" rx="32" ry="16" fill="#0284C7" stroke="#38BDF8" stroke-width="1.5" opacity="0.9"/>
      <!-- Park Trees -->
      <g transform="translate(25, 10)">
        <polygon points="0,15 10,20 20,15 10,10" fill="#166534"/>
        <line x1="10" y1="15" x2="10" y2="25" stroke="#78350F" stroke-width="2"/>
        <circle cx="10" cy="8" r="9" fill="#22C55E"/>
      </g>
      <g transform="translate(100, 15)">
        <polygon points="0,15 10,20 20,15 10,10" fill="#166534"/>
        <line x1="10" y1="15" x2="10" y2="25" stroke="#78350F" stroke-width="2"/>
        <circle cx="10" cy="8" r="8" fill="#4ADE80"/>
      </g>
    </g>

    <!-- Clean Energy Wind Turbine (Far Right) -->
    <g transform="translate(560, 240)">
      <polygon points="0,20 25,32 50,20 25,8" fill="#334155"/>
      <line x1="25" y1="20" x2="25" y2="-45" stroke="#E2E8F0" stroke-width="3"/>
      <circle cx="25" cy="-45" r="4" fill="#0EA5E9"/>
      <!-- 3 Blades -->
      <line x1="25" y1="-45" x2="10" y2="-75" stroke="#F1F5F9" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="25" y1="-45" x2="48" y2="-32" stroke="#F1F5F9" stroke-width="2.5" stroke-linecap="round"/>
      <line x1="25" y1="-45" x2="18" y2="-22" stroke="#F1F5F9" stroke-width="2.5" stroke-linecap="round"/>
    </g>

    <!-- Isometric Little Cars on road -->
    <g transform="translate(370, 210)">
      <polygon points="0,8 14,15 28,8 14,1" fill="#EF4444"/>
      <circle cx="6" cy="11" r="2.5" fill="#0F172A"/>
      <circle cx="22" cy="11" r="2.5" fill="#0F172A"/>
    </g>
    <g transform="translate(480, 260)">
      <polygon points="0,8 14,15 28,8 14,1" fill="#38BDF8"/>
      <circle cx="6" cy="11" r="2.5" fill="#0F172A"/>
      <circle cx="22" cy="11" r="2.5" fill="#0F172A"/>
    </g>

    <!-- Emergency Crisis Alert floating pin -->
    <g transform="translate(280, 160)" filter="url(#cityGlow)">
      <circle cx="15" cy="15" r="16" fill="#EF4444"/>
      <circle cx="15" cy="15" r="13" fill="#DC2626"/>
      <text x="15" y="21" font-size="14" text-anchor="middle" fill="#FFFFFF">🚨</text>
    </g>

    <!-- TOP HUD OVERLAY - Matching real game UI! -->
    <g transform="translate(20, 12)">
      <!-- Main Brand Pill -->
      <rect width="180" height="42" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1.2"/>
      <text x="14" y="26" font-size="18">🏙️</text>
      <text x="40" y="21" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">Cidade em Caos</text>
      <text x="40" y="34" font-family="'Poppins', sans-serif" font-size="8.5" fill="#38BDF8">Gestão Metropolitana</text>

      <!-- Resource Pills -->
      <!-- Money -->
      <g transform="translate(190, 0)">
        <rect width="105" height="42" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="12" y="26" font-size="15">💰</text>
        <text x="32" y="19" font-family="'Poppins', sans-serif" font-size="8" fill="#94A3B8">Tesouro</text>
        <text x="32" y="33" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#FBBF24">R$ 1.500</text>
      </g>

      <!-- Energy -->
      <g transform="translate(303, 0)">
        <rect width="105" height="42" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="12" y="26" font-size="15">⚡</text>
        <text x="32" y="19" font-family="'Poppins', sans-serif" font-size="8" fill="#94A3B8">Energia</text>
        <text x="32" y="33" font-family="'Poppins', sans-serif" font-size="10" font-weight="700" fill="#38BDF8">+46 MW</text>
      </g>

      <!-- Population -->
      <g transform="translate(416, 0)">
        <rect width="105" height="42" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="12" y="26" font-size="15">👥</text>
        <text x="32" y="19" font-family="'Poppins', sans-serif" font-size="8" fill="#94A3B8">População</text>
        <text x="32" y="33" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#F8FAFC">150 hab</text>
      </g>

      <!-- Satisfaction -->
      <g transform="translate(529, 0)">
        <rect width="105" height="42" rx="10" fill="#0F172A" stroke="#334155" stroke-width="1"/>
        <text x="12" y="26" font-size="15">😊</text>
        <text x="32" y="19" font-family="'Poppins', sans-serif" font-size="8" fill="#94A3B8">Satisfação</text>
        <text x="32" y="33" font-family="'Poppins', sans-serif" font-size="11" font-weight="700" fill="#34D399">82%</text>
      </g>

      <!-- Chaos Level Meter -->
      <g transform="translate(642, 0)">
        <rect width="118" height="42" rx="10" fill="#0F172A" stroke="#BE123C" stroke-width="1.2"/>
        <text x="10" y="26" font-size="15">🚨</text>
        <text x="30" y="17" font-family="'Poppins', sans-serif" font-size="8" fill="#FDA4AF">Nível de Caos</text>
        <text x="96" y="17" font-family="'Poppins', sans-serif" font-size="9" font-weight="700" fill="#F43F5E">5%</text>
        <!-- Bar track -->
        <rect x="30" y="24" width="76" height="8" rx="4" fill="#33101E"/>
        <rect x="30" y="24" width="10" height="8" rx="4" fill="#F43F5E"/>
      </g>
    </g>

    <!-- BOTTOM TICKER OVERLAY -->
    <g transform="translate(20, 400)">
      <rect width="760" height="38" rx="8" fill="#0F172A" fill-opacity="0.9" stroke="#334155" stroke-width="1"/>
      <!-- Pulse badge -->
      <rect x="8" y="7" width="130" height="24" rx="6" fill="#BE123C"/>
      <circle cx="20" cy="19" r="4" fill="#FEE2E2"/>
      <text x="32" y="23" font-family="'Poppins', sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">Plantão da Cidade</text>
      <text x="150" y="23" font-family="'Poppins', sans-serif" font-size="10.5" fill="#E2E8F0">Simulação iniciada • Nova gestão assume o controle da metrópole em tempo real.</text>
    </g>
  </g>
</svg>
